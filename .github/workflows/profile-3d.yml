name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    name: Generate GitHub Profile 3D Contrib

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate 3D Contribution Skyline
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: ./profile-3d-settings.json

      - name: Keep only the contribution map
        run: |
          find . -name 'profile-*.svg' -not -path './.git/*' -print0 \
            | xargs -0 python3 .github/scripts/clean_profile_svgs.py

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add -A .

          if git commit -m "update 3D contribution skyline"; then
            git push
          fi