<svg xmlns="http://www.w3.org/2000/svg" width="880" height="140" viewBox="0 0 880 140" role="img" aria-labelledby="title desc">
  <title id="title">devnote.txt</title>
  <desc id="desc">Developer note: Hardware taught me patience. Software taught me to lower my expectations. I use both daily.</desc>
  <style>
    .l { stroke: #3d444d; stroke-width: 1; fill: none; }
    .d { fill: #7d8590; }
    .n { fill: #388bfd; }
    .e { fill: #d29922; }
    .quote { fill: #a8b8cc; }
    .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace; }
    @media (prefers-color-scheme: light) {
      .l { stroke: #d0d7de; }
      .d { fill: #57606a; }
      .n { fill: #0969da; }
      .e { fill: #9a6700; }
      .quote { fill: #57606a; }
    }
  </style>
  <!-- Transparent 24px spacer above the card separates it from the filesystem panel. -->
  <rect x="0.5" y="24.5" width="879" height="115" rx="5" class="l"/>
  <path class="l" d="M1 58.5 H879"/>
  <circle cx="18" cy="41.5" r="3.5" class="n"/>
  <text x="30" y="47" class="mono" font-size="18" font-weight="700" xml:space="preserve"><tspan class="d">~/</tspan><tspan class="n">devnote</tspan><tspan class="e">.txt</tspan></text>
  <text x="862" y="45" class="mono d" font-size="10" text-anchor="end">README FOOTER // 001</text>
  <path d="M18 72 H862" stroke="#212b38" stroke-width="1"/>
  <text x="20" y="96" class="mono quote" font-size="13.5">Hardware taught me patience. Software taught me to lower my expectations.</text>
  <text x="20" y="115" class="mono quote" font-size="13.5">I use both daily.</text>
</svg>
