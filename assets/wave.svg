<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="waving hand" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>waving hand</title>
  <!-- wave for ~1.2s, rest for ~1.2s, loop forever; pivot is the wrist (bottom of the hand) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" dur="2.4s" repeatCount="indefinite"
      keyTimes="0;0.10;0.22;0.34;0.46;0.58;0.70;1"
      values="0 24 40; 16 24 40; -10 24 40; 16 24 40; -10 24 40; 12 24 40; 0 24 40; 0 24 40" />
    <text x="24" y="38" font-size="36" text-anchor="middle"
      font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif">👋</text>
  </g>
</svg>
